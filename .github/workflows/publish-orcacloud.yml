name: Publish to OrcaCloud

# Runs when a GitHub release is published. Nothing happens until you:
#   1. Create the plugin on Orca Cloud and connect this repo under
#      Edit plugin > GitHub publishing, and
#   2. Set the repository variable ORCACLOUD_PUBLISH to "true"
#      (Settings > Secrets and variables > Actions > Variables).

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  # Space-separated globs of the plugin files to upload (.whl / .py).
  PLUGIN_FILES: "dist/*.py"

jobs:
  publish:
    if: vars.ORCACLOUD_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the tag matches the plugin version
        run: python scripts/check_version.py "$GITHUB_REF_NAME"

      - name: Build the plugin for every OS
        run: python scripts/build.py

      - name: Publish release to OrcaCloud
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          args=(--form-string "metadata=$metadata")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
